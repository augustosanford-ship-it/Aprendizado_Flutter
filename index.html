h1.t,h2{font:700 28px/1.2 Georgia,serif;margin:0 0 8px}h3{margin:18px 0 4px;color:var(--c);font-size:17px}

p{margin:6px 0}ol.st{padding-left:22px;margin:4px 0}ol.st li{margin:3px 0}ol.st li::marker{color:var(--c);font-weight:700}

a saída? Escreva."], ["w", 3]]], ["Aula 3: Hardware", "Dispositivos de entrada e de saída", [["h", "Entrada"], ["l", ["Teclado, mouse e touchpad.", "Microfone e webcam.", "Scanner e tela sensível ao toque.", "Controles de videogame."]], ["h", "Saída"], ["l", ["Monitor e projetor.", "Caixas de som e fones de ouvido.", "Impressora."]], ["b", "Alguns dispositivos fazem as duas coisas, como a tela de toque do celular (mostra e recebe toques)."], ["x", "Aponte 5 dispositivos do computador em que você está e escreva se são de entrada ou de saída."], ["w", 3]]], ["Aula 3: Hardware", "Por dentro do computador", [["l", ["<b>Processador (CPU)</b>: o “cérebro”, que executa as tarefas. Quanto mais rápido, mais tarefas por segundo.", "<b>Memória RAM</b>: a memória de trabalho. Guarda o que está aberto agora e some quando desliga.", "<b>Armazenamento (SSD ou HD)</b>: guarda arquivos de forma permanente. O SSD é bem mais rápido que o HD.", "<b>Placa-mãe</b>: a placa onde tudo se conecta.", "<b>Fonte</b>: leva a energia para as peças.", "<b>Placa de vídeo</b>: ajuda com imagens e jogos."]], ["b", "Analogia: a CPU é o cozinheiro, a RAM é a bancada de trabalho e o SSD é o armário onde ficam os ingredientes guardados."]]], ["Aula 3: Hardware", "Wordwall e exercícios da aula 3", [["x", "Acesse wordwall.net/pt-br/community/hardware-e-software e jogue as atividades de hardware. Anote 3 peças que você ainda não conhecia."], ["h", "Ligue a peça à função"], ["l", ["Monitor: ____________________", "Teclado: ____________________", "Processador: ____________________", "SSD: ____________________"]], ["h", "Pergunta"], ["l", ["Qual a diferença entre RAM e SSD?"]], ["w", 3]]], ["Aula 4: Software", "O que é software", [["p", "<b>Software</b> é o conjunto de programas que dizem ao hardware o que fazer. Sem software, o computador é só um monte de peças."], ["l", ["<b>Sistema operacional</b>: controla o computador e os outros programas. Exemplos: Windows, Linux, macOS, Android e iOS.", "<b>Aplicativos</b>: servem para tarefas, como navegar, escrever, editar fotos e jogar.", "<b>Jogos</b>: um tipo de aplicativo, como o Roblox."]], ["b", "Atualizar o software corrige falhas de segurança. Por isso as atualizações são importantes."]]], ["Aula 4: Software", "Conhecendo o sistema operacional", [["l", ["<b>Área de trabalho</b>: a tela inicial, com ícones e atalhos.", "<b>Janela</b>: o espaço onde um programa aparece. Dá para minimizar, maximizar e fechar.", "<b>Pasta</b>: um espaço para organizar arquivos.", "<b>Arquivo</b>: um documento, uma imagem, uma música ou um vídeo."]], ["h", "Organizando"], ["l", ["Dê nomes claros aos arquivos (Trabalho_Historia, e não Novo1).", "Crie pastas por assunto.", "Evite deixar tudo solto na área de trabalho."]], ["x", "Crie uma pasta com o seu nome e outra para cada curso. Salve um arquivo em cada uma."]]], ["Aula 4: Software", "Wordwall e exercícios da aula 4", [["x", "No Wordwall, jogue as atividades de software. Depois classifique como hardware (H) ou software (S):"], ["l", ["Chrome: ____", "Mouse: ____", "Windows: ____", "Monitor: ____", "Roblox: ____", "Impressora: ____"]], ["h", "Perguntas"], ["l", ["O que faz um sistema operacional?", "Cite 5 softwares que você usa."]], ["w", 3]]], ["Aula 5: Navegadores e internet", "O que é a internet", [["p", "A <b>internet</b> é uma rede mundial que liga milhões de computadores. A <b>web</b> é uma parte dela: o conjunto de páginas e sites que abrimos pelo navegador."], ["p", "O <b>navegador</b> (browser) é o programa que abre sites. Exemplos: Chrome, Edge, Firefox e Safari. Já o <b>buscador</b>, como o Google, é um site que procura outras páginas para você."], ["b", "Não confunda: navegador abre os sites; buscador encontra os sites."], ["x", "Abra dois navegadores diferentes e acesse o mesmo site em ambos. O que mudou na aparência?"], ["w", 3]]], ["Aula 5: Navegadores e internet", "As partes do navegador", [["l", ["<b>Barra de endereço</b>: onde se digita a URL, como www.exemplo.com.", "<b>Abas</b>: permitem abrir várias páginas ao mesmo tempo.", "<b>Voltar, avançar e atualizar</b>: os botões de navegação.", "<b>Favoritos</b>: guardam sites que você usa muito.", "<b>Histórico</b>: lista as páginas que você visitou.", "<b>Downloads</b>: lista os arquivos baixados."]], ["x", "Abra 3 abas, salve um site nos favoritos e depois encontre-o no histórico."]]], ["Aula 5: Navegadores e internet", "Pesquisando bem", [["l", ["Use <b>palavras-chave</b> curtas, como “como funciona o computador”.", "Use aspas para buscar uma frase exata.", "Compare pelo menos 2 resultados.", "Veja quem escreveu e quando foi publicado."]], ["h", "Como saber se uma fonte é confiável"], ["l", ["Tem autor e data?", "É um site conhecido, escola, universidade ou governo?", "Outras fontes dizem a mesma coisa?", "O texto exagera ou promete milagres?"]], ["x", "Pesquise um tema, anote 2 fontes e diga se cada uma é confiável e por quê."], ["w", 3]]], ["Aula 5: Navegadores e internet", "Segurança na internet", [["l", ["<b>Senhas fortes</b>: use letras, números e símbolos, e nunca compartilhe.", "<b>Cadeado e https</b>: sites que pedem dados devem ter o cadeado ao lado do endereço.", "<b>Golpes</b>: desconfie de prêmios, links estranhos e pedidos urgentes de dinheiro.", "<b>Downloads</b>: baixe apenas de sites oficiais.", "<b>Dados pessoais</b>: não passe endereço, telefone nem documentos para desconhecidos."]], ["b", "Na dúvida, não clique. Pergunte a um adulto ou ao professor."], ["h", "Perguntas"], ["l", ["O que é um golpe de internet? Dê um exemplo.", "O que torna uma senha forte?"]], ["w", 3]]], ["Aula 6: Arquivos, PDF e revisão", "Arquivos e formatos", [["p", "Todo arquivo tem um <b>formato</b>, indicado pela extensão no final do nome, depois do ponto."], ["l", ["<code>.docx</code>: documento de texto (Word).", "<code>.jpg</code> e <code>.png</code>: imagens.", "<code>.mp3</code>: áudio. <code>.mp4</code>: vídeo.", "<code>.pdf</code>: documento que parece igual em qualquer aparelho."]], ["b", "Converter é mudar o formato de um arquivo, por exemplo de Word para PDF."], ["x", "Procure no computador um arquivo de cada formato da lista e anote o nome deles."], ["w", 3]]], ["Aula 6: Arquivos, PDF e revisão", "iLovePDF: converter e juntar", [["p", "O site ilovepdf.com/pt oferece ferramentas gratuitas para trabalhar com PDF."], ["l", ["<b>Word para PDF</b>: transforma um texto em PDF.", "<b>JPG para PDF</b>: transforma fotos em PDF.", "<b>Juntar PDF</b>: une vários PDFs em um só.", "<b>Dividir PDF</b>: separa páginas.", "<b>Comprimir PDF</b>: diminui o tamanho do arquivo."]], ["h", "Passo a passo"], ["l", ["Escolha a ferramenta.", "Envie o arquivo.", "Clique em converter ou juntar.", "Baixe o resultado e confira se abre."]], ["b", "Não envie documentos pessoais ou sigilosos para sites online. Use apenas arquivos de prática."]]], ["Aula 6: Arquivos, PDF e revisão", "Revisão com Kahoot", [["p", "O professor abre um quiz no Kahoot. Entre em kahoot.it, digite o código (PIN) e escolha um apelido. Responda rápido, mas com atenção."], ["h", "Perguntas de revisão"], ["l", ["Quais as teclas da linha base e onde ficam os indicadores?", "O que é hardware? E software?", "Cite um dispositivo de entrada e um de saída.", "Qual a função do processador?", "Qual a diferença entre navegador e buscador?", "Cite 2 cuidados de segurança na internet.", "Para que serve o formato PDF?"]], ["x", "Meus pontos no Kahoot:"], ["w", 1]]], ["Aula 6: Arquivos, PDF e revisão", "Autoavaliação e fechamento do curso", [["h", "Marque o que você já sabe fazer"], ["l", ["Digitar sem olhar o teclado e conhecer a linha base.", "Usar o mouse com precisão.", "Diferenciar hardware de software e dar exemplos.", "Organizar arquivos em pastas.", "Navegar, pesquisar e identificar sites confiáveis.", "Proteger meus dados e minhas senhas.", "Converter e juntar arquivos PDF."]], ["x", "O que foi mais fácil para mim? O que preciso treinar mais?"], ["w", 4], ["x", "Observações do professor:"], ["w", 3]]]]}, {"n": "Criação de Jogos", "s": "Flowlab 2D e Roblox Studio com IA", "a": [["Flowlab: o primeiro personagem", "flowlab.io", "Fazer um personagem 2D se mover.", "No Flowlab tudo é um objeto (jogador, moeda, parede). Cada objeto recebe comportamentos, como andar e pular. A fase é o cenário onde eles ficam.", "Crie um projeto novo|Crie o objeto Jogador|Adicione movimento com as setas e teste", "Um comportamento de pulo faz o personagem subir nas plataformas.", "Um personagem andando e pulando em uma fase simples."], ["Flowlab: fase, itens e obstáculos", "flowlab.io", "Montar uma fase que dá para vencer.", "Chão e plataformas bloqueiam o jogador. Itens somem ao serem coletados. Obstáculos reiniciam a fase. Uma boa fase é desafiadora, mas possível.", "Crie chão e plataformas|Crie moedas que somem ao toque|Crie um espinho que reinicia a fase", "Moedas em lugares altos convidam o jogador a pular.", "Fase com 3 plataformas, 5 itens e 2 obstáculos."], ["Flowlab: pontos, som e fim", "flowlab.io", "Finalizar e compartilhar o jogo.", "Uma variável guarda um valor que muda, como a pontuação. Sons e telas de vitória e derrota deixam o jogo completo.", "Crie a variável pontos|Mostre a pontuação na tela|Adicione sons e uma tela de vitória", "Cada moeda soma 10 pontos na variável 'pontos'.", "Publique o jogo e dê notas de 1 a 5 ao jogo de um colega."], ["Roblox Studio: o primeiro mapa 3D", "Roblox Studio", "Construir um mapa com Parts.", "Parts são blocos (cubo, esfera, cilindro). O Explorer lista tudo do jogo e o Properties muda cor e tamanho. O Spawn é onde o jogador nasce.", "Crie um projeto Baseplate|Insira Parts e mude cor e material|Monte um percurso e teste", "Um obby é um percurso de plataformas feito só com Parts.", "Percurso com 8 plataformas e um ponto de largada."], ["Criando jogos com IA: scripts", "Roblox Studio e uma IA", "Usar IA para ajudar com scripts simples.", "Script é um código em Lua que diz ao objeto o que fazer. O prompt é o pedido à IA e, quanto mais claro, melhor a resposta. A IA pode errar, então sempre teste.", "Escreva a ideia do jogo em 3 linhas|Peça um script simples à IA|Cole no Script, teste e leia o código", "Prompt: 'No Roblox Studio, faça uma plataforma sumir quando o jogador pisar'.", "Um script feito com IA funcionando no jogo."], ["Finalizando e apresentando", "Roblox Studio", "Polir, testar com colegas e apresentar.", "Um jogo bom é testado por outras pessoas. Observe onde elas se confundem e corrija. Na apresentação, explique tema, regras e como a IA ajudou.", "Adicione itens e checkpoints|Peça a 2 colegas que joguem|Corrija e apresente à turma", "Se todos caem no mesmo pulo, ele provavelmente está difícil demais.", "Apresente: nome do jogo, objetivo e como a IA ajudou."]], "pg": [["Aula 1: Flowlab, o primeiro personagem", "O que é um jogo digital", [["p", "Todo jogo tem quatro ingredientes. Antes de criar o seu, aprenda a reconhecê-los em jogos que você já joga:"], ["l", ["<b>Objetivo</b>: o que o jogador quer conseguir (chegar ao fim da fase, juntar moedas).", "<b>Regras</b>: o que pode e o que não pode (tocar no espinho faz perder).", "<b>Desafio</b>: o que dificulta o objetivo (inimigos, buracos, tempo).", "<b>Recompensa</b>: o que o jogador ganha (pontos, itens, uma nova fase)."]], ["h", "2D e 3D"], ["p", "Em um jogo <b>2D</b>, tudo se move em duas direções: horizontal (X) e vertical (Y). Em um jogo <b>3D</b> existe também a profundidade (Z). Vamos começar pelo 2D, no Flowlab, e depois ir para o 3D, no Roblox Studio."], ["b", "Quem cria jogos usa três habilidades: ideia (design), arte e programação. Neste curso você vai treinar as três."], ["x", "Escolha um jogo que você gosta e escreva o objetivo, uma regra, um desafio e uma recompensa dele."], ["w", 4]]], ["Aula 1: Flowlab, o primeiro personagem", "Conhecendo o Flowlab", [["p", "O Flowlab (flowlab.io) é um editor de jogos 2D que funciona no navegador, sem instalar nada. Crie uma conta gratuita para salvar seus projetos."], ["h", "Os conceitos principais"], ["l", ["<b>Objeto (ator)</b>: qualquer coisa do jogo, como o jogador, uma moeda, uma parede ou um inimigo.", "<b>Comportamento</b>: o que o objeto faz. Andar, pular, desaparecer e perseguir são comportamentos.", "<b>Fase (cena)</b>: o cenário onde os objetos são colocados.", "<b>Física</b>: regras como gravidade e colisão, que fazem os objetos caírem e se baterem."]], ["h", "O fluxo de trabalho"], ["l", ["Criar o objeto e dar a ele uma imagem.", "Adicionar comportamentos.", "Colocar o objeto na fase.", "Testar com o botão de play e ajustar."]], ["b", "Os nomes dos botões e das abas podem mudar quando o Flowlab é atualizado. O que vale é a lógica: objeto, comportamento, fase e teste."]]], ["Aula 1: Flowlab, o primeiro personagem", "Criando o jogador e o movimento", [["l", ["Crie um projeto novo e dê um nome a ele.", "Crie um objeto chamado Jogador e desenhe ou escolha uma imagem.", "Adicione os comportamentos de movimento com as setas do teclado.", "Ative a gravidade e um comportamento de pulo.", "Coloque o Jogador na fase e teste."]], ["h", "Ajustando o movimento"], ["l", ["<b>Velocidade</b>: alta demais e o jogador é difícil de controlar. Baixa demais e o jogo fica lento.", "<b>Força do pulo</b>: deve permitir alcançar as plataformas, mas não passar por cima de tudo.", "<b>Gravidade</b>: define a rapidez com que o jogador cai."]], ["b", "Um bom movimento é a base do jogo. Jogos famosos de plataforma gastam meses só para acertar o pulo."], ["x", "Faça o personagem andar para os lados e pular. Teste 3 valores diferentes de velocidade e anote qual ficou melhor."], ["w", 2]]], ["Aula 1: Flowlab, o primeiro personagem", "Prática e exercícios da aula 1", [["x", "Monte uma fase com um chão e o Jogador. Mude a cor e o tamanho do personagem e deixe-o 20% mais rápido."], ["h", "Erros comuns"], ["l", ["O personagem atravessa o chão: o chão não tem comportamento de bloqueio.", "O personagem não se mexe: faltam os comportamentos de teclado.", "O personagem cai para sempre: não há chão embaixo dele na fase."]], ["h", "Perguntas"], ["l", ["O que é um objeto no Flowlab?", "O que é um comportamento? Dê um exemplo.", "Por que testar logo depois de cada mudança?"]], ["w", 3], ["b", "Desafio: faça o jogador ficar maior quando você apertar uma tecla."]]], ["Aula 2: Flowlab, fases e obstáculos", "Como projetar uma fase", [["p", "Uma boa fase não é só um monte de plataformas. Ela conta uma pequena história de desafio, em três momentos:"], ["l", ["<b>Ensinar</b>: o começo mostra a mecânica com segurança (um buraco pequeno, sem perigo).", "<b>Desafiar</b>: o meio combina o que o jogador aprendeu (buraco com espinho).", "<b>Recompensar</b>: o final entrega a vitória ou uma surpresa."]], ["h", "Curva de dificuldade"], ["p", "Comece fácil e aumente aos poucos. Se for difícil demais cedo, o jogador desiste. Se for fácil demais, ele se entedia."], ["b", "Regra de ouro: a fase tem que ser possível de vencer. Teste antes de chamar alguém."], ["x", "Desenhe no papel o mapa da sua fase com o começo, o meio e o final. Marque onde ficam os itens e os obstáculos."], ["w", 3]]], ["Aula 2: Flowlab, fases e obstáculos", "Plataformas, colisão e itens", [["p", "<b>Colisão</b> é quando dois objetos se encostam. Ela explica por que o jogador pisa no chão (a colisão bloqueia a queda) e por que pega uma moeda (a colisão ativa o item)."], ["l", ["<b>Chão e plataformas</b>: objetos que bloqueiam o jogador.", "<b>Itens</b>: objetos que desaparecem quando o jogador encosta e somam pontos.", "<b>Objetos decorativos</b>: não colidem. Servem só para deixar a fase bonita."]], ["h", "Passo a passo"], ["l", ["Crie os objetos Chão e Plataforma e faça-os bloquear o jogador.", "Crie o objeto Moeda.", "Dê à moeda um comportamento que a destrói ao tocar o jogador.", "Espalhe moedas pela fase, algumas em lugares altos."]], ["b", "Moedas em fileira mostram o caminho. Moedas no alto convidam o jogador a pular."]]], ["Aula 2: Flowlab, fases e obstáculos", "Obstáculos, inimigos e reinício", [["l", ["<b>Espinho</b>: obstáculo parado. Ao tocar, reinicia a fase.", "<b>Inimigo</b>: obstáculo que se move, como um objeto que anda de um lado para o outro.", "<b>Buraco</b>: se o jogador cair para fora da fase, reinicia."]], ["h", "Passo a passo"], ["l", ["Crie o objeto Espinho.", "Dê a ele um comportamento que reinicia a fase ao tocar o Jogador.", "Crie um inimigo com movimento de ir e voltar.", "Teste. Se estiver impossível, afaste os obstáculos ou aumente as plataformas."]], ["b", "Desafio justo: o jogador precisa sentir que perdeu por um erro dele, e não por azar."], ["x", "Monte uma fase com pelo menos 3 plataformas, 5 moedas e 2 obstáculos."]]], ["Aula 2: Flowlab, fases e obstáculos", "Playtest e exercícios da aula 2", [["p", "<b>Playtest</b> é deixar outra pessoa jogar enquanto você só observa, sem ajudar. Anote onde ela erra e onde ela se diverte."], ["l", ["Peça a um colega que jogue sem dicas.", "Observe onde ele trava ou desiste.", "Pergunte: foi fácil, médio ou difícil?", "Corrija e teste de novo."]], ["h", "Resultado do meu playtest"], ["w", 4], ["h", "Perguntas"], ["l", ["O que é colisão?", "Por que uma fase precisa começar mais fácil?", "Qual a vantagem do playtest?"]], ["w", 3]]], ["Aula 3: Flowlab, pontos, som e fim", "Variáveis e pontuação", [["p", "Uma <b>variável</b> é uma caixinha com nome que guarda um valor que pode mudar. A pontuação do jogo é uma variável."], ["c", "pontos = 0\npegou uma moeda -> pontos = pontos + 10\npegou outra moeda -> pontos = pontos + 10\npontos agora vale 20"], ["p", "O texto acima é uma ideia (pseudocódigo), e não um código real. Ele mostra a lógica que você vai montar no Flowlab com os comportamentos e as variáveis do editor."], ["l", ["Crie uma variável chamada pontos, começando em 0.", "Faça a moeda somar 10 pontos ao ser coletada.", "Mostre o valor de pontos na tela, em um texto."]], ["b", "As variáveis aparecem em todo tipo de jogo: vidas, tempo, energia, dinheiro e nível."]]], ["Aula 3: Flowlab, pontos, som e fim", "Sons, música e tela final", [["p", "Sons dão <b>retorno</b> (feedback) ao jogador. Quando ele pega uma moeda e ouve um “ding”, o cérebro entende que acertou. Chamamos isso de “sensação do jogo” (game feel)."], ["l", ["Som curto para pular, pegar moeda e perder.", "Música de fundo baixa, que não atrapalhe.", "Efeitos visuais simples, como a moeda sumindo com um brilho."]], ["h", "Telas de vitória e de fim de jogo"], ["l", ["<b>Vitória</b>: aparece quando o jogador chega ao objeto de chegada.", "<b>Fim de jogo</b>: aparece quando ele perde. Mostre a pontuação e uma forma de tentar de novo."]], ["x", "Adicione 2 sons e uma tela de vitória ao seu jogo. Use só sons permitidos pelo próprio Flowlab ou criados por você."]]], ["Aula 3: Flowlab, pontos, som e fim", "Publicar e avaliar", [["p", "Publique o seu jogo pelo Flowlab e compartilhe o link. Jogue o jogo de um colega e preencha a ficha, com notas de 1 a 5."], ["l", ["Diversão: ______", "Visual: ______", "Dificuldade equilibrada: ______", "Criatividade: ______"]], ["h", "Um comentário construtivo"], ["p", "Escreva uma coisa que ficou boa e uma sugestão. Por exemplo: “A fase é divertida, mas o segundo pulo está muito difícil”."], ["w", 3], ["h", "Perguntas"], ["l", ["Para que serve uma variável?", "Por que os sons melhoram um jogo?"]], ["w", 2]]], ["Aula 4: Roblox Studio, o mundo 3D", "Do 2D ao 3D: conhecendo o Roblox Studio", [["p", "O <b>Roblox Studio</b> é o programa gratuito usado para criar jogos no Roblox. Você baixa em create.roblox.com e entra com uma conta Roblox. Ele precisa de um computador com uma configuração razoável."], ["h", "O mundo 3D"], ["p", "O 3D usa três eixos: <b>X</b> (esquerda e direita), <b>Y</b> (para cima e para baixo) e <b>Z</b> (para a frente e para trás). Tudo que existe no jogo tem uma posição nesses três eixos."], ["h", "Parts"], ["p", "As peças básicas se chamam <b>Parts</b>: bloco, esfera, cilindro e cunha. Um prédio, uma ponte e até um personagem são feitos de várias Parts juntas."], ["b", "Roblox é uma plataforma onde outras pessoas jogam o que você cria. Por isso, crie com respeito: nada ofensivo e nada que use obras de outros sem permissão."]]], ["Aula 4: Roblox Studio, o mundo 3D", "A interface do Roblox Studio", [["l", ["<b>Viewport</b>: a janela central onde você vê o mundo.", "<b>Explorer</b>: a lista de tudo que existe no jogo.", "<b>Properties</b>: as características do objeto escolhido, como cor, tamanho e material.", "<b>Toolbox</b>: biblioteca de objetos prontos."]], ["h", "As ferramentas de edição"], ["l", ["<b>Move</b>: move a Part.", "<b>Scale</b>: muda o tamanho.", "<b>Rotate</b>: gira.", "<b>Select</b>: escolhe os objetos."]], ["h", "Primeiros passos"], ["l", ["Crie um projeto com o modelo Baseplate (um chão grande).", "Na aba Model, insira uma Part.", "Use Move, Scale e Rotate.", "No Properties, mude Color e Material."]], ["b", "Os nomes e as posições dos menus podem mudar com as atualizações do Roblox Studio."]]], ["Aula 4: Roblox Studio, o mundo 3D", "Construindo um obby", [["p", "Obby (obstacle course) é um percurso de obstáculos feito de plataformas. É o primeiro jogo ideal para aprender."], ["l", ["Insira a primeira Part e dê a ela cor e material.", "Duplique (Ctrl + D) e afaste para formar as plataformas.", "No Properties, marque <b>Anchored</b>. Sem isso, a Part cai com a gravidade.", "Insira um <b>SpawnLocation</b>, que é o ponto onde o jogador nasce.", "Aumente a distância entre as plataformas aos poucos."]], ["b", "Sempre teste com o botão Play. Você controla um personagem para ver se os pulos são possíveis."], ["x", "Monte um percurso com 8 plataformas, um ponto de largada e uma torre no final."]]], ["Aula 4: Roblox Studio, o mundo 3D", "Testes e exercícios da aula 4", [["h", "Erros comuns"], ["l", ["A plataforma cai: falta marcar Anchored.", "O jogador nasce no lugar errado: confira onde está o SpawnLocation.", "Os pulos são impossíveis: aproxime as plataformas."]], ["h", "Perguntas"], ["l", ["O que é uma Part?", "Para que serve o Explorer?", "O que acontece se a Part não estiver Anchored?"]], ["w", 3], ["b", "Desafio: faça uma ponte, uma escada e uma torre usando só Parts."]]], ["Aula 5: Criando jogos com IA", "O que é programar", [["p", "<b>Programar</b> é escrever instruções que o computador segue. Pense em uma receita de bolo: uma lista de passos, na ordem certa. O computador não adivinha nada, ele só obedece ao que está escrito."], ["l", ["<b>Algoritmo</b>: a lista de passos para resolver um problema.", "<b>Linguagem de programação</b>: o “idioma” em que escrevemos os passos.", "<b>Script</b>: um arquivo de código com instruções para um objeto."]], ["p", "No Roblox, a linguagem é o <b>Lua</b>. Ela foi criada no Brasil, na PUC-Rio, no início dos anos 1990."], ["b", "Aprender a programar é aprender a pensar em passos: dividir um problema grande em partes pequenas."]]], ["Aula 5: Criando jogos com IA", "Seu primeiro script em Lua", [["p", "Insira um <b>Script</b> dentro de uma Part (clique no + ao lado da Part no Explorer). Este é um “bloco que elimina”: quem o toca perde a vida."], ["c", "local parte = script.Parent\n\nparte.Touched:Connect(function(outro)\n  local humanoide = outro.Parent:FindFirstChild(\"Humanoid\")\n  if humanoide then\n    humanoide.Health = 0\n  end\nend)"], ["l", ["<code>script.Parent</code>: a Part onde o script está.", "<code>Touched</code>: o evento que acontece quando alguém encosta.", "<code>function(outro)</code>: o que fazer quando acontecer; <code>outro</code> é quem encostou.", "<code>FindFirstChild(\"Humanoid\")</code>: confere se quem encostou é um personagem.", "<code>if ... then</code>: só faz a ação se a condição for verdadeira.", "<code>Health = 0</code>: zera a vida do personagem."]]]], ["Aula 5: Criando jogos com IA", "Usando IA para criar e entender scripts", [["p", "A IA pode escrever um script para você, mas você precisa entender o que colocou no jogo. Use a fórmula <b>contexto + tarefa + detalhes</b>:"], ["c", "Estou criando um jogo no Roblox Studio.\nEscreva um script em Lua para uma plataforma que\ndesaparece 1 segundo depois que o jogador pisa nela.\nExplique cada linha de forma simples."], ["l", ["Cole o script em um Script dentro da Part.", "Aperte Play e teste.", "Se der erro, olhe a janela Output (ela mostra a mensagem) e copie o erro para a IA, perguntando o que significa.", "Peça a explicação linha a linha e confira com o que você aprendeu."]], ["b", "A IA pode errar e inventar comandos que não existem. Se não funcionar, não é culpa sua: ajuste o pedido e teste de novo."]]], ["Aula 5: Criando jogos com IA", "Exercícios com scripts", [["p", "Um exemplo pronto para estudar: a plataforma que desaparece."], ["c", "local plataforma = script.Parent\n\nplataforma.Touched:Connect(function(outro)\n  if outro.Parent:FindFirstChild(\"Humanoid\") then\n    task.wait(1)\n    plataforma.Transparency = 1\n    plataforma.CanCollide = false\n  end\nend)"], ["l", ["<code>task.wait(1)</code>: espera 1 segundo.", "<code>Transparency = 1</code>: deixa a Part invisível.", "<code>CanCollide = false</code>: deixa de bloquear o jogador."]], ["x", "Peça à IA um script de plataforma que muda de cor ao ser tocada. Teste, leia o código e explique-o com suas palavras."], ["w", 3], ["b", "Desafio: faça a plataforma voltar ao normal depois de 3 segundos."]]], ["Aula 6: Finalização e apresentação", "Polimento: deixando o jogo bonito e justo", [["l", ["<b>Cenário</b>: troque o cinza por cores e materiais. Use iluminação para criar clima.", "<b>Checkpoints</b>: vários SpawnLocation espalhados evitam que o jogador volte ao início sempre que cair.", "<b>Dificuldade</b>: aumente aos poucos, como em uma boa fase.", "<b>Som</b>: uma música de fundo e um som ao vencer."]], ["b", "Cada detalhe a mais é uma escolha de design. Se não ajuda o jogador a entender ou se divertir, é decoração demais."], ["x", "Adicione pelo menos 2 checkpoints e melhore o visual de uma parte do mapa."]]], ["Aula 6: Finalização e apresentação", "Playtest e correção", [["p", "Peça a dois colegas que joguem sem receber dicas. Observe e anote, em silêncio."], ["l", ["Onde o jogador ficou confuso?", "Onde ele caiu várias vezes?", "Onde ele sorriu?", "Ele entendeu o objetivo sozinho?"]], ["h", "Minhas anotações do playtest"], ["w", 5], ["h", "O que vou corrigir"], ["w", 3]]], ["Aula 6: Finalização e apresentação", "Apresentação e autoavaliação", [["h", "Roteiro da apresentação"], ["l", ["Nome do jogo e tema.", "Objetivo, regras e desafio.", "A parte mais difícil de fazer.", "O script que a IA ajudou a criar e o que você aprendeu com ele."]], ["h", "Autoavaliação"], ["l", ["Sei explicar objetivo, regras, desafio e recompensa.", "Sei criar personagem, itens e obstáculos no Flowlab.", "Sei usar variáveis para fazer uma pontuação.", "Sei construir um mapa no Roblox Studio.", "Sei usar IA para criar um script e testar se funciona."]], ["x", "Observações do professor:"], ["w", 3]]]]}, {"n": "Criação de Sites", "s": "W3Schools (HTML e CSS), Google Sites e IA", "a": [["HTML: a estrutura da página", "w3schools.com (HTML)", "Entender as tags básicas do HTML.", "HTML organiza o conteúdo com tags: h1 é título, p é parágrafo, img é imagem e a é link. As tags geralmente abrem e fecham.", "Abra o tutorial de HTML do W3Schools|Edite um exemplo em 'Try it Yourself'|Crie um título, um parágrafo e um link", "&lt;h1&gt;Meu site&lt;/h1&gt; cria o título principal da página.", "Monte uma página com título, texto, imagem e link."], ["CSS: cores, fontes e layout", "w3schools.com (CSS)", "Mudar o visual da página com CSS.", "CSS dá estilo ao HTML. Uma regra escolhe um elemento e define propriedades, como color, font-size e background.", "Abra o tutorial de CSS do W3Schools|Mude a cor e a fonte do título|Teste background e margin", "h1 { color: blue; } deixa todos os títulos azuis.", "Estilize sua página com 3 cores e uma fonte."], ["Google Sites: planejar e montar", "sites.google.com", "Planejar o site e montar a página inicial.", "Um site é um conjunto de páginas ligadas por um menu. Planeje o mapa antes: início, duas páginas de conteúdo e contato. Use tema, imagem de capa e botões.", "Escolha o tema e desenhe o mapa|Crie o site e escolha o visual|Monte a página inicial com imagem e botões", "Um site de jogos pode ter: Início, Meus jogos, Dicas e Contato.", "Página inicial com título, imagem, texto e 2 botões."], ["Google Sites: páginas e publicação", "sites.google.com", "Criar as páginas, o menu e publicar.", "Cada página tem seu conteúdo. Formulários do Google coletam opiniões. Ao publicar, escolha o endereço e quem pode ver. Nunca publique dados pessoais.", "Crie as páginas do mapa|Incorpore um vídeo ou formulário|Publique e teste o link", "O botão Visualizar mostra o site como o visitante verá.", "Site com 4 páginas, menu funcionando e link publicado."], ["Site com IA: conteúdo", "Uma IA de conversa", "Usar IA para criar textos e ideias.", "Peça à IA com detalhes: tema, público, tamanho e tom. Peça variações e escolha a melhor. A IA pode inventar fatos, então confira antes de publicar.", "Peça 5 nomes para o site|Peça um texto de apresentação|Revise e adapte com suas palavras", "Prompt: 'Crie 5 nomes para um site de jogos de aventura para adolescentes'.", "Troque 3 textos do site por versões melhoradas e revisadas."], ["Site com IA: projeto completo", "Uma IA e Google Sites", "Planejar um site inteiro com apoio da IA.", "A IA pode sugerir a estrutura de páginas, os textos e as paletas de cores. Você decide o que fica, corrige erros e dá personalidade ao resultado.", "Peça a estrutura do site à IA|Compare com o seu mapa|Monte, revise e apresente", "A IA pode sugerir uma página de perguntas frequentes em que você não tinha pensado.", "Apresente o site: tema, o que a IA fez bem e o que você corrigiu."]], "pg": [["Aula 1: HTML", "Como a web funciona", [["p", "Quando você digita um endereço no navegador, ele pede a página a um computador chamado <b>servidor</b>. O servidor devolve arquivos e o navegador os transforma na página que você vê. Três linguagens trabalham juntas:"], ["l", ["<b>HTML</b>: a estrutura e o conteúdo (títulos, textos, imagens). É o esqueleto da casa.", "<b>CSS</b>: o visual (cores, fontes, espaços). É a pintura e a decoração.", "<b>JavaScript</b>: o comportamento (botões que reagem, jogos). É a parte elétrica."]], ["h", "URL, domínio e link"], ["p", "A <b>URL</b> é o endereço completo, como <code>https://www.w3schools.com/html/</code>. O <b>domínio</b> é o nome do site (w3schools.com). Um <b>link</b> leva de uma página para outra."], ["b", "Um site é feito de arquivos de texto. Para criar o primeiro, basta o Bloco de Notas e um navegador."], ["x", "Clique com o botão direito em qualquer site e escolha “Inspecionar”. Você está vendo o HTML e o CSS daquela página."]]], ["Aula 1: HTML", "A estrutura de um documento HTML", [["p", "Todo arquivo HTML segue o mesmo esqueleto. Salve o texto abaixo como <code>index.html</code> e abra no navegador (dois cliques no arquivo)."], ["c", "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Meu primeiro site</title>\n</head>\n<body>\n  <h1>Olá, mundo!</h1>\n  <p>Esta é minha primeira página.</p>\n</body>\n</html>"], ["l", ["<code>&lt;!DOCTYPE html&gt;</code> avisa ao navegador que o arquivo é HTML5.", "<code>&lt;html&gt;</code> envolve a página inteira.", "<code>&lt;head&gt;</code> guarda informações que não aparecem na página, como o título da aba.", "<code>&lt;body&gt;</code> guarda tudo que o visitante vê."]], ["x", "Try it Yourself: acesse w3schools.com/html, abra “HTML Introduction” e clique em “Try it Yourself”. Troque o texto do título e clique em “Run”. O site é em inglês: use o tradutor do navegador."]]], ["Aula 1: HTML", "O que é uma tag?", [["p", "A palavra <b>tag</b> vem do inglês e significa etiqueta ou marca. Uma tag é uma marca que dizemos ao navegador: “este trecho é um título”, “este trecho é um parágrafo”. Por isso o HTML (HyperText Markup Language) se chama <b>linguagem de marcação de hipertexto</b>: o texto recebe marcas."], ["p", "A ideia de marcar textos já existia em linguagens anteriores, como o SGML. No início dos anos 1990, o cientista Tim Berners-Lee, no CERN, criou o HTML para que documentos pudessem se ligar por links, o chamado <b>hipertexto</b>. Foi a base da web."], ["h", "Anatomia de uma tag"], ["c", "<p>Meu texto</p>"], ["l", ["<code>&lt;p&gt;</code>: tag de abertura.", "Meu texto: o conteúdo.", "<code>&lt;/p&gt;</code>: tag de fechamento (repare na barra)."]], ["p", "Algumas tags não fecham, como <code>&lt;br&gt;</code> (quebra de linha) e <code>&lt;img&gt;</code> (imagem). Uma tag pode ter <b>atributos</b>, que dão detalhes, como em <code>&lt;a href=\"https://google.com\"&gt;</code>."]]], ["Aula 1: HTML", "As tags principais", [["c", "<h1>Título principal</h1>\n<h2>Subtítulo</h2>\n<p>Parágrafo com <b>negrito</b> e <i>itálico</i>.</p>\n<ul>\n  <li>Item de lista</li>\n  <li>Outro item</li>\n</ul>\n<a href=\"https://www.w3schools.com\">Ir ao W3Schools</a>\n<img src=\"foto.jpg\" alt=\"Descrição da foto\">"], ["l", ["<b>h1 a h6</b>: títulos, do mais importante ao menor.", "<b>p</b>: parágrafo. <b>b</b> e <b>i</b>: negrito e itálico.", "<b>ul e li</b>: lista com marcadores (use <b>ol</b> para lista numerada).", "<b>a</b>: link. O destino fica no atributo <code>href</code>.", "<b>img</b>: imagem. O atributo <code>alt</code> descreve a imagem para quem não consegue vê-la."]], ["b", "Dica: indente (recue) as tags que estão dentro de outras. O código fica fácil de ler e de corrigir."]]], ["Aula 1: HTML", "Prática e exercícios de HTML", [["x", "No W3Schools, abra os capítulos HTML Headings, Paragraphs, Links, Images e Lists. Em cada um, altere o exemplo no Try it Yourself e clique em Run."], ["h", "Projeto: minha página de apresentação"], ["l", ["Um título com o seu nome.", "Um parágrafo sobre você.", "Uma lista com 3 hobbies.", "Um link para o seu site favorito.", "Uma imagem com texto alternativo."]], ["b", "Erros comuns: esquecer de fechar a tag, salvar sem a extensão <code>.html</code> e apagar uma aspa de um atributo."], ["h", "Perguntas"], ["l", ["Qual a diferença entre head e body?", "O que significa a sigla HTML?", "Para que serve o atributo alt?"]], ["w", 3]]], ["Aula 2: CSS", "O que é CSS", [["p", "CSS (Cascading Style Sheets, folhas de estilo em cascata) controla a aparência do HTML. Sem CSS, a página é texto preto sobre fundo branco. Com CSS, ganha cores, fontes e organização."], ["h", "Uma regra CSS"], ["c", "h1 {\n  color: blue;\n  font-size: 32px;\n}"], ["l", ["<b>h1</b>: o seletor, que escolhe o que será estilizado.", "<b>color</b> e <b>font-size</b>: as propriedades.", "<b>blue</b> e <b>32px</b>: os valores."]], ["h", "Três formas de usar CSS"], ["l", ["<b>Inline</b>: dentro da tag, como <code>&lt;p style=\"color:red\"&gt;</code>. Serve para testes.", "<b>Interno</b>: dentro de <code>&lt;style&gt;</code>, no head.", "<b>Externo</b>: em um arquivo <code>estilo.css</code> ligado com <code>&lt;link rel=\"stylesheet\" href=\"estilo.css\"&gt;</code>. É a forma mais organizada."]]]], ["Aula 2: CSS", "Cores, fontes e textos", [["p", "Cores podem ser nomes (<code>red</code>), códigos hexadecimais (<code>#1f8a70</code>) ou RGB (<code>rgb(31,138,112)</code>)."], ["c", "body {\n  background-color: #f4f7fb;\n  font-family: Arial, sans-serif;\n}\nh1 {\n  color: #1f8a70;\n  text-align: center;\n}\np {\n  font-size: 18px;\n  line-height: 1.5;\n}"], ["l", ["<b>background-color</b>: cor de fundo.", "<b>font-family</b>: tipo de letra, com opções reserva.", "<b>text-align</b>: alinhamento (left, center, right).", "<b>line-height</b>: espaço entre as linhas, que facilita a leitura."]], ["x", "No W3Schools, abra CSS Colors, CSS Backgrounds e CSS Fonts e teste cada exemplo no Try it Yourself."]]], ["Aula 2: CSS", "Classes e o modelo de caixa", [["p", "Para estilizar só alguns elementos, use <b>classes</b>. No HTML: <code>&lt;p class=\"destaque\"&gt;</code>. No CSS, o nome começa com ponto:"], ["c", ".destaque {\n  background-color: yellow;\n  padding: 10px;\n  border: 2px solid black;\n  margin: 20px;\n}"], ["p", "Todo elemento é uma <b>caixa</b>: conteúdo, <b>padding</b> (espaço interno), <b>border</b> (borda) e <b>margin</b> (espaço externo)."], ["b", "Padding é o espaço entre o texto e a borda. Margin é o espaço entre a borda e os vizinhos."], ["x", "No W3Schools, abra CSS Box Model e mude os valores de padding e margin para ver o efeito."]]], ["Aula 2: CSS", "Layout simples e prática", [["p", "Com <b>flexbox</b>, os itens ficam lado a lado:"], ["c", ".linha {\n  display: flex;\n  gap: 16px;\n}\n.cartao {\n  background: #ddd2f2;\n  padding: 16px;\n  border-radius: 8px;\n}"], ["p", "No HTML, coloque três <code>&lt;div class=\"cartao\"&gt;</code> dentro de um <code>&lt;div class=\"linha\"&gt;</code>. Teste também no W3Schools, em CSS Flexbox."], ["h", "Projeto"], ["l", ["Ligue um arquivo estilo.css ao seu index.html.", "Use pelo menos 3 cores e 1 fonte.", "Crie uma classe e uma linha com 3 cartões."]], ["h", "Perguntas"], ["l", ["Qual a diferença entre padding e margin?", "Como ligar um CSS externo?"]], ["w", 2]]], ["Aula 2: CSS", "Cola rápida de HTML e CSS", [["h", "Tags de HTML"], ["l", ["<code>&lt;h1&gt;</code> a <code>&lt;h6&gt;</code>: títulos. <code>&lt;p&gt;</code>: parágrafo. <code>&lt;br&gt;</code>: quebra de linha.", "<code>&lt;a href&gt;</code>: link. <code>&lt;img src alt&gt;</code>: imagem.", "<code>&lt;ul&gt;</code>, <code>&lt;ol&gt;</code>, <code>&lt;li&gt;</code>: listas.", "<code>&lt;div&gt;</code>: caixa para agrupar elementos.", "<code>&lt;b&gt;</code> e <code>&lt;i&gt;</code>: negrito e itálico."]], ["h", "Propriedades de CSS"], ["l", ["<code>color</code>, <code>background-color</code>: cores.", "<code>font-family</code>, <code>font-size</code>: letra.", "<code>text-align</code>, <code>line-height</code>: texto.", "<code>margin</code>, <code>padding</code>, <code>border</code>: caixa.", "<code>display: flex</code>, <code>gap</code>: layout em linha."]], ["b", "Guarde esta página: ela resume o que você aprendeu nas aulas 1 e 2."]]], ["Aula 3: Google Sites, planejar e montar", "Planejando o site", [["p", "Antes de abrir qualquer ferramenta, planeje. Responda: <b>qual é o tema</b>, <b>quem vai visitar</b> e <b>o que o visitante deve conseguir fazer</b>."], ["l", ["Tema: hobby, projeto da escola, negócio, banda, jogo.", "Público: colegas, clientes, família.", "Objetivo: conhecer, aprender, entrar em contato."]], ["h", "O mapa do site"], ["l", ["Início: apresentação e botões.", "Conteúdo 1 e 2: o assunto principal.", "Contato: formulário ou e-mail."]], ["b", "Identidade visual: escolha 2 ou 3 cores e 1 ou 2 fontes e use sempre as mesmas. Sites consistentes parecem mais profissionais."], ["x", "Escreva o tema do seu site, o público e o mapa de páginas."], ["w", 4]]], ["Aula 3: Google Sites, planejar e montar", "Criando o site e conhecendo o editor", [["l", ["Acesse sites.google.com e entre com a sua conta Google.", "Clique em “Em branco” ou escolha um modelo.", "Dê um nome ao site, no topo.", "No painel da direita, a aba Inserir adiciona texto, imagens, vídeos e botões.", "A aba Páginas gerencia as páginas e o menu.", "A aba Temas muda as cores e as fontes do site inteiro."]], ["p", "O Google Sites salva sozinho. Use o botão Visualizar para ver o site como o visitante verá."], ["b", "Os nomes dos botões podem mudar um pouco com as atualizações do Google, mas a lógica é a mesma."], ["x", "Crie um site em branco, dê um nome a ele e troque o tema três vezes para ver a diferença."]]], ["Aula 3: Google Sites, planejar e montar", "Montando a página inicial", [["l", ["Escolha o tema visual na aba Temas.", "Adicione um título e uma imagem de capa.", "Insira uma caixa de texto com a apresentação, em 2 ou 3 frases curtas.", "Use um layout para colocar texto e imagem lado a lado.", "Adicione botões que levam às outras páginas."]], ["h", "Boas práticas"], ["l", ["Textos curtos e títulos claros.", "Imagens próprias ou livres de direitos autorais.", "Bom contraste entre o texto e o fundo."]], ["h", "Checklist da página inicial"], ["l", ["Título", "Imagem", "Apresentação", "2 botões", "Visualização no celular conferida"]]]], ["Aula 4: Google Sites, páginas e publicação", "Páginas e menu", [["l", ["Na aba Páginas, clique no + e crie as páginas do seu mapa.", "Arraste as páginas para mudar a ordem do menu.", "Para criar uma subpágina, arraste uma página para a direita de outra.", "Em cada página, adicione textos, imagens e uma galeria ou tabela.", "Teste todos os links e botões."]], ["b", "Dê nomes curtos às páginas, porque eles viram o menu."], ["x", "No HTML, você ligava páginas com <code>&lt;a href&gt;</code>. No Google Sites, o menu faz esse trabalho. Crie as 4 páginas do seu mapa e confira o menu."]]], ["Aula 4: Google Sites, páginas e publicação", "Vídeos, formulários e mapas", [["l", ["Vídeo: aba Inserir, YouTube, escolha o vídeo.", "Formulário: crie um Formulário Google e, em Inserir, escolha Formulários.", "Mapa: Inserir, Mapas.", "Documentos e apresentações do Drive: Inserir, Drive."]], ["p", "Antes de incorporar arquivos do Drive, confira se a permissão de compartilhamento deixa os visitantes verem."], ["h", "Acessibilidade"], ["l", ["Use textos descritivos nos links (evite “clique aqui”).", "Descreva as imagens.", "Não use só a cor para passar uma informação."]]]], ["Aula 4: Google Sites, páginas e publicação", "Publicando com segurança", [["l", ["Clique em Publicar e escolha o endereço do site.", "Defina quem pode ver: qualquer pessoa ou só pessoas escolhidas.", "Abra o link em outra aba e teste no celular.", "Compartilhe com um colega e peça uma opinião."]], ["h", "Segurança"], ["l", ["Não publique telefone, endereço, documentos nem fotos de menores sem autorização.", "Use só imagens permitidas.", "Revise a ortografia."]], ["b", "Depois de publicado, toda mudança precisa ser publicada de novo para aparecer ao público."], ["x", "Anote o link do seu site publicado."], ["w", 2]]], ["Aula 5: Site com IA, conteúdo", "O que é um bom prompt", [["p", "Prompt é o pedido que você faz à IA. Quanto mais claro, melhor a resposta. Use a fórmula <b>contexto + tarefa + formato + tom</b>:"], ["c", "Contexto: faço um site de jogos de aventura para adolescentes.\nTarefa: crie 5 nomes e uma frase de apresentação para cada.\nFormato: lista numerada.\nTom: divertido."], ["l", ["Sem contexto, a IA chuta.", "Peça variações e depois peça para melhorar a melhor.", "Converse: a IA aceita ajustes como “mais curto” ou “mais simples”."]]]], ["Aula 5: Site com IA, conteúdo", "Criando textos e ideias", [["l", ["Nomes e slogans para o site.", "Texto de apresentação da página inicial.", "Perguntas e respostas para uma página de dúvidas.", "Descrições curtas para as imagens.", "Paleta de cores com códigos hexadecimais."]], ["p", "Agora que você conhece HTML e CSS, também pode pedir um trecho de código e testá-lo no Try it Yourself do W3Schools. Leia o código antes de usar."], ["x", "Peça à IA 5 nomes para o seu site e um texto de 3 frases curtas para a página inicial. Escolha, corrija e anote o resultado."], ["w", 3]]], ["Aula 5: Site com IA, conteúdo", "Revisar, conferir e ser ético", [["l", ["<b>Confira os fatos</b>: a IA pode inventar dados, datas e nomes.", "<b>Adapte</b> com o seu jeito de falar.", "<b>Direitos autorais</b>: não copie textos de terceiros.", "<b>Privacidade</b>: não envie dados pessoais para a IA.", "<b>Transparência</b>: avise quando algo foi feito com ajuda de IA."]], ["b", "A IA é uma assistente. O autor e responsável pelo site é você."], ["h", "Perguntas"], ["l", ["Por que é preciso revisar o texto da IA?", "O que um bom prompt precisa ter?"]], ["w", 2]]], ["Aula 6: Projeto final com IA", "Planejando o projeto final com IA", [["p", "Peça à IA uma estrutura de site para o seu tema e compare com o seu mapa."], ["c", "Crie a estrutura de um site sobre [tema] para [público].\nListe as páginas e o que colocar em cada uma."], ["h", "Compare"], ["l", ["O que a IA sugeriu que você não tinha pensado?", "Com o que você não concorda?", "O que você vai manter?"]], ["w", 3]]], ["Aula 6: Projeto final com IA", "Construindo e revisando", [["l", ["Monte o site no Google Sites com a estrutura escolhida.", "Se quiser, incorpore um trecho de HTML e CSS seu (Inserir, Incorporar).", "Revise textos, links, imagens e a versão para celular.", "Publique e teste o link."]], ["h", "Checklist do projeto"], ["l", ["4 páginas ou mais", "Menu funcionando", "Formulário ou vídeo incorporado", "Textos revisados", "Link publicado"]]]], ["Aula 6: Projeto final com IA", "Apresentação e autoavaliação", [["l", ["Apresente o tema, o público e a estrutura.", "Mostre uma parte feita com HTML e CSS.", "Conte o que a IA fez bem e o que você corrigiu."]], ["h", "Autoavaliação"], ["l", ["Sei explicar o que são HTML, CSS e tag.", "Sei criar uma página HTML com título, texto, lista, link e imagem.", "Sei mudar cores e fontes com CSS.", "Sei montar e publicar um site no Google Sites.", "Sei usar IA com revisão e ética."]], ["x", "Observações do professor:"], ["w", 3]]]]}, {"n": "Aprofundamento de IA", "s": "Conexões, tipos de IA e redes sociais", "a": [["Conexões de IA", "Uma IA de conversa", "Entender como a IA funciona e se conecta.", "IA aprende padrões em muitos dados e usa isso para responder ou criar. Ela pode se ligar à internet e a outros apps para fazer tarefas. Ela também pode errar e repetir preconceitos.", "Faça uma pergunta vaga|Faça a mesma pergunta com detalhes|Compare as respostas", "Vaga: 'fale de jogos'. Detalhada: '3 jogos de aventura para 12 anos'.", "Liste 3 apps do seu celular que usam IA."], ["Tipos de IA: capacidade", "Atividade em sala", "Diferenciar os tipos de IA.", "IA estreita faz uma tarefa específica e é a que existe hoje. IA geral faria qualquer tarefa como uma pessoa e ainda é só uma ideia. IA reativa só reage ao agora e IA com memória usa o passado.", "Leia os 4 tipos|Dê um exemplo de cada|Classifique os casos do professor", "A recomendação de vídeos é uma IA estreita com memória.", "Classifique 4 exemplos e explique com suas palavras."], ["Tipos de IA: criar e reconhecer", "Uma IA generativa", "Conhecer IA generativa, de reconhecimento e de recomendação.", "IA generativa cria textos, imagens e músicas. IA de reconhecimento identifica rostos, vozes e objetos. Aprendizado de máquina é aprender com exemplos.", "Crie um texto curto com IA|Crie uma imagem sobre o mesmo tema|Compare com o que você imaginou", "O filtro de câmera que encontra seu rosto usa reconhecimento.", "Ache um erro em uma resposta de IA e explique."], ["IA nas redes sociais: o feed", "Seu app favorito", "Entender como o algoritmo escolhe o que você vê.", "O algoritmo observa o que você curte, assiste e por quanto tempo. Isso cria a bolha de conteúdo, em que só vemos coisas parecidas. Os anúncios também são escolhidos por IA.", "Observe seu feed por 5 minutos|Anote 3 itens que apareceram|Explique por que apareceram", "Se você assiste a vários vídeos de jogos, vão aparecer mais jogos.", "Monte uma tabela: o que apareceu e por quê."], ["Criando conteúdo com IA", "IA de texto e imagem", "Planejar conteúdo com criatividade e ética.", "A IA ajuda com ideias, roteiros, legendas e capas. Você revisa tudo e coloca seu jeito de falar. Avise quando algo foi feito com IA.", "Peça 10 ideias de posts e escolha 3|Peça roteiros curtos|Crie capas e revise tudo", "Roteiro de 30 segundos: gancho, dica e convite para seguir.", "Monte um calendário de 3 posts."], ["Uso responsável", "Atividade em grupo", "Reconhecer fake news, deepfakes e riscos de privacidade.", "Fake news parece verdade, mas é falsa. Deepfake é vídeo ou voz falsa criada por IA. Não envie senhas, documentos nem fotos de outras pessoas para ferramentas de IA.", "Veja quem publicou|Compare com fontes confiáveis|Desconfie de imagem perfeita demais", "Um vídeo famoso dizendo algo absurdo pode ser um deepfake.", "Analise 3 exemplos e escreva 3 regras suas para usar IA."]], "pg": [["Aula 1: Conexões de IA", "O que é inteligência artificial", [["p", "<b>Inteligência artificial (IA)</b> é a área da computação que cria programas capazes de fazer tarefas que normalmente exigem inteligência humana: entender a fala, reconhecer imagens, traduzir, jogar e criar textos."], ["h", "IA no dia a dia"], ["l", ["Recomendações de vídeos e músicas.", "Tradutores e corretores de texto.", "Filtros e desbloqueio facial da câmera.", "Assistentes de voz e mapas com trânsito.", "Jogos com inimigos que reagem ao jogador."]], ["b", "A IA não pensa como uma pessoa. Ela encontra padrões em dados e usa isso para responder ou prever."], ["x", "Liste 3 aplicativos do seu celular que usam IA e o que ela faz em cada um."], ["w", 3]]], ["Aula 1: Conexões de IA", "Como a IA aprende", [["p", "Uma IA aprende com <b>dados</b>: milhões de exemplos de textos, imagens ou sons. O processo se chama <b>aprendizado de máquina</b> (machine learning)."], ["l", ["<b>Treino</b>: a IA vê muitos exemplos e ajusta o seu funcionamento para acertar mais.", "<b>Padrões</b>: ela descobre o que os exemplos têm em comum.", "<b>Uso</b>: diante de algo novo, aplica o que aprendeu."]], ["h", "Analogia"], ["p", "É como aprender a reconhecer cachorros: depois de ver milhares de fotos, você identifica um cachorro que nunca viu. Mas se só viu cachorros pequenos, pode estranhar um grande."], ["b", "Por isso a IA pode errar e repetir preconceitos: ela só aprende o que existe nos dados que recebeu."]]], ["Aula 1: Conexões de IA", "Como a IA se conecta ao mundo", [["p", "Uma IA sozinha só conversa. Ao ser <b>conectada</b> a outros serviços, ela pode agir:"], ["l", ["Consultar a internet para dar informações atuais.", "Ler e organizar documentos, planilhas e agendas, com a sua permissão.", "Controlar apps, como tocar música ou criar um lembrete.", "Trabalhar dentro de outros programas, como editores e jogos."]], ["h", "Cuidados"], ["l", ["Só dê acesso ao que for necessário.", "Leia as permissões antes de aceitar.", "Nunca compartilhe senhas com a IA."]], ["b", "Quanto mais conectada, mais útil a IA fica, e mais cuidado você precisa ter com os seus dados."]]], ["Aula 1: Conexões de IA", "Prática e exercícios da aula 1", [["x", "Faça a mesma pergunta a uma IA de duas formas: uma vaga (“fale de jogos”) e outra detalhada (“cite 3 jogos de aventura para 12 anos e diga por quê”). Compare."], ["w", 4], ["h", "Perguntas"], ["l", ["O que é IA?", "De onde a IA tira o que sabe?", "Por que a IA pode errar?"]], ["w", 3], ["b", "Desafio: peça à IA para explicar um assunto da escola e confira em outra fonte se está correto."]]], ["Aula 2: Tipos de IA, capacidade", "IA estreita, geral e superinteligência", [["l", ["<b>IA estreita</b>: faz uma tarefa específica muito bem, como traduzir ou recomendar vídeos. É a única que existe hoje.", "<b>IA geral</b>: faria qualquer tarefa intelectual como uma pessoa. Ainda é uma ideia e um objetivo de pesquisa.", "<b>Superinteligência</b>: uma IA muito mais capaz que qualquer humano. É um tema de debates e de ficção."]], ["b", "As IAs que conversam parecem gerais porque falam de tudo, mas continuam sendo sistemas treinados em textos, com limites e erros."], ["x", "Em qual categoria você colocaria o recomendador de vídeos? E o robô de um filme que faz de tudo?"], ["w", 3]]], ["Aula 2: Tipos de IA, capacidade", "IA reativa, com memória e outras ideias", [["p", "Os pesquisadores também classificam as IAs pela forma de funcionar:"], ["l", ["<b>Reativa</b>: só reage ao que está acontecendo agora, sem lembrar do passado. Exemplo: um programa de xadrez simples.", "<b>Com memória limitada</b>: usa dados recentes e antigos para decidir. Exemplo: o carro que observa o trânsito.", "<b>Teoria da mente</b>: entenderia sentimentos e intenções. Ainda é pesquisa.", "<b>Autoconsciente</b>: teria consciência de si. Só existe na ficção."]], ["b", "A maioria das IAs que usamos é reativa ou com memória limitada."]]], ["Aula 2: Tipos de IA, capacidade", "Exercícios da aula 2", [["h", "Classifique"], ["l", ["Recomendação de músicas: ______________", "Filtro que reconhece o rosto: ______________", "Assistente que responde perguntas: ______________", "Robô de filme com consciência: ______________"]], ["h", "Perguntas"], ["l", ["Qual a diferença entre IA estreita e IA geral?", "A IA de hoje é estreita ou geral?", "O que é uma IA reativa?"]], ["w", 3]]], ["Aula 3: Tipos de IA, função", "IA generativa", [["p", "<b>IA generativa</b> cria conteúdo novo a partir de um pedido (prompt): textos, imagens, músicas, vídeos e códigos."], ["l", ["<b>Texto</b>: respostas, resumos, histórias e roteiros.", "<b>Imagem</b>: ilustrações a partir de uma descrição.", "<b>Áudio e vídeo</b>: vozes, músicas e cenas.", "<b>Código</b>: trechos de programas."]], ["h", "Limites"], ["l", ["Pode inventar fatos com muita confiança.", "Pode errar detalhes, como mãos e letras em imagens.", "Pode repetir preconceitos dos dados."]], ["b", "Tudo que a IA gera precisa ser conferido por você."]]], ["Aula 3: Tipos de IA, função", "Reconhecimento, recomendação e previsão", [["l", ["<b>Reconhecimento</b>: identifica rostos, voz, objetos e textos em imagens. Exemplo: o desbloqueio facial.", "<b>Recomendação</b>: sugere o que você pode gostar. Exemplo: a lista de vídeos.", "<b>Previsão</b>: calcula o que provavelmente vai acontecer. Exemplo: o tempo, o trânsito e o preço de uma corrida.", "<b>Classificação</b>: separa coisas em grupos. Exemplo: o filtro de spam do e-mail."]], ["b", "Muitos aplicativos misturam vários tipos. Um app de rede social usa recomendação, reconhecimento e geração ao mesmo tempo."], ["x", "Escolha um aplicativo e descubra 2 tipos de IA que ele usa."], ["w", 3]]], ["Aula 3: Tipos de IA, função", "Prática com IA generativa", [["x", "Peça a uma IA um texto curto sobre um tema que você gosta e uma imagem sobre o mesmo tema. Responda abaixo."], ["l", ["O resultado ficou como você imaginava?", "O que você mudaria no pedido?", "Você confiaria em tudo que a IA escreveu?"]], ["w", 4], ["h", "Caça ao erro"], ["p", "Procure um erro, de fato ou de detalhe, no que a IA criou e explique por que você acha que ela errou."], ["w", 3]]], ["Aula 4: IA nas redes sociais", "Como as redes sociais usam IA", [["l", ["<b>Feed</b>: decide a ordem do que você vê.", "<b>Recomendação</b>: sugere vídeos, perfis e grupos.", "<b>Moderação</b>: ajuda a detectar conteúdo impróprio, mas também erra.", "<b>Anúncios</b>: escolhe propagandas para o seu perfil.", "<b>Filtros e efeitos</b>: reconhecem rosto e movimentos.", "<b>Legendas e tradução automáticas</b>."]], ["b", "Nada disso é aleatório: existe um sistema decidindo o que aparece para você."], ["x", "Abra o seu app favorito e anote 3 recursos que parecem usar IA."], ["w", 3]]], ["Aula 4: IA nas redes sociais", "O algoritmo e a bolha", [["p", "O <b>algoritmo</b> é o conjunto de regras que escolhe o conteúdo. Ele observa sinais:"], ["l", ["O que você curte, comenta e compartilha.", "Por quanto tempo você fica em cada vídeo.", "O que você pesquisa e segue."]], ["h", "Bolha de conteúdo"], ["p", "Quando você só recebe coisas parecidas com o que já gosta, forma-se uma <b>bolha</b>. Ela é confortável, mas pode mostrar uma visão limitada do mundo."], ["b", "Para furar a bolha: siga perfis variados, procure fontes diferentes e converse com pessoas que pensam de outro jeito."]]], ["Aula 4: IA nas redes sociais", "Dados, anúncios e privacidade", [["p", "Para recomendar e anunciar, os aplicativos coletam dados: o que você vê, onde está, o que pesquisa e com quem fala."], ["l", ["Revise as configurações de privacidade do app.", "Deixe o perfil privado, se possível.", "Limite quem vê suas fotos e sua localização.", "Desconfie de apps que pedem permissões demais."]], ["b", "Se um serviço é gratuito, muitas vezes os seus dados fazem parte do pagamento."], ["h", "Pergunta"], ["l", ["Por que as redes coletam tantos dados?"]], ["w", 3]]], ["Aula 4: IA nas redes sociais", "Prática: observando o feed", [["x", "Observe o seu feed por 5 minutos e preencha:"], ["l", ["Item 1 e por que apareceu: ____________________", "Item 2 e por que apareceu: ____________________", "Item 3 e por que apareceu: ____________________"]], ["h", "Para conversar"], ["l", ["Como a IA ajuda quem usa redes sociais?", "Como ela pode atrapalhar?"]], ["w", 3], ["b", "Desafio: por um dia, assista a conteúdos diferentes do seu costume e veja se o feed muda."]]], ["Aula 5: Criando conteúdo com IA", "Planejando um perfil ou canal", [["p", "Antes de postar, planeje. Responda:"], ["l", ["<b>Tema</b>: sobre o que será o seu canal (jogos, dicas, estudos)?", "<b>Público</b>: quem vai assistir?", "<b>Identidade</b>: nome, cores e estilo.", "<b>Frequência</b>: quantos posts por semana você consegue fazer?"]], ["b", "Um canal com tema claro é mais fácil de seguir do que um que fala de tudo."], ["x", "Escreva o tema, o público e o nome do seu canal (pode ser fictício)."], ["w", 4]]], ["Aula 5: Criando conteúdo com IA", "Ideias, roteiros e legendas com IA", [["c", "Contexto: tenho um canal de dicas de jogos para adolescentes.\nTarefa: dê 10 ideias de vídeos curtos.\nFormato: lista numerada, com uma frase de explicação.\nTom: divertido."], ["p", "Escolha 3 ideias e peça o roteiro. Um bom vídeo curto segue uma estrutura simples:"], ["l", ["<b>Gancho</b>: os primeiros 3 segundos que prendem a atenção.", "<b>Desenvolvimento</b>: a dica ou a história.", "<b>Convite</b>: peça para seguir ou comentar."]], ["b", "Use a IA para ideias e rascunhos, mas grave e escreva com a sua própria voz."]]], ["Aula 5: Criando conteúdo com IA", "Capas e imagens com IA", [["l", ["Descreva o estilo, as cores e o que aparece na imagem.", "Peça mais de uma versão e escolha.", "Evite pedir imagens de pessoas reais ou de personagens protegidos.", "Confira se não há erros, como letras tortas ou mãos estranhas."]], ["c", "Capa de vídeo para um canal de dicas de jogos.\nEstilo colorido e divertido,
