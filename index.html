<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Apostilas dos Cursos</title><style>
:root{--desk:#10272b;--paper:#fbfcfe;--ink:#16222a;--mut:#52616c;--c:#d9482b;--tint:#f7d3c8;box-sizing:border-box;padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--desk:#081416}}
:root[data-theme=dark]{--desk:#081416}
*{box-sizing:inherit}html,body{margin:0}body{background:var(--desk);color:#fff;font:16px/1.55 "Trebuchet MS","Segoe UI",Verdana,sans-serif;min-height:100%}
header{text-align:center;padding:22px 0 6px}header h1{font:700 26px Georgia,serif;margin:0 0 12px}
#tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{border:2px solid var(--c);background:transparent;color:#fff;padding:8px 15px;border-radius:999px;font:inherit;cursor:pointer}.tab[aria-selected=true]{background:var(--c)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.book{max-width:1000px;margin:20px auto 8px;perspective:1800px}
.spread{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);color:var(--ink);border-radius:6px 16px 16px 6px;box-shadow:0 22px 44px #0009;min-height:540px;position:relative}
.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:36px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#0002,transparent);pointer-events:none}
.pg{padding:30px 34px;min-width:0}#L{background:var(--tint);border-radius:6px 0 0 6px;display:flex;flex-direction:column;justify-content:center}
#L svg{width:100%;max-width:250px;margin:0 auto 14px;display:block}
h1.t,h2{font:700 28px/1.2 Georgia,serif;margin:0 0 8px}h3{margin:18px 0 4px;color:var(--c);font-size:17px}
.meta{color:var(--mut);margin:0}.num{margin:0;font-weight:700;color:var(--c)}
p{margin:6px 0}ol.st{padding-left:22px;margin:4px 0}ol.st li{margin:3px 0}ol.st li::marker{color:var(--c);font-weight:700}
.ex{background:var(--tint);padding:10px 14px;border-radius:8px;margin:14px 0}
.at{border:2px solid var(--c);border-radius:8px;padding:10px 14px}.at i{display:block;height:24px;border-bottom:1px solid #b8c2ca}
.toc{list-style:none;padding:0;margin:10px 0}.toc button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #d5dde3;padding:10px 4px;font:inherit;color:var(--ink);cursor:pointer}.toc button:hover{color:var(--c)}
.turnF{animation:tf .55s ease both;transform-origin:left center}.turnB{animation:tb .55s ease both;transform-origin:right center}
@keyframes tf{from{transform:rotateY(-100deg);opacity:.2}to{transform:none;opacity:1}}@keyframes tb{from{transform:rotateY(100deg);opacity:.2}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.turnF,.turnB{animation:none}}
nav{display:flex;justify-content:center;align-items:center;gap:16px;padding:10px 0 28px}
nav button{background:var(--c);color:#fff;border:0;border-radius:999px;padding:11px 22px;font:inherit;cursor:pointer}nav button:disabled{opacity:.35;cursor:default}
@media(max-width:720px){.spread{grid-template-columns:1fr}.spread:after{display:none}#L{border-radius:6px 16px 0 0}.pg{padding:22px}}
.tl{list-style:none;padding:0;margin:0}.tl li{padding:10px 0;border-bottom:1px solid #d5dde3}.tl span{display:block;color:var(--mut)}.tl a{color:var(--c);font-weight:700}pre{background:#eef1f4;padding:10px 12px;border-radius:8px;overflow:auto;font:13px/1.45 Consolas,monospace;margin:8px 0}code{font-family:Consolas,monospace;background:#e8edf2;padding:0 4px;border-radius:4px}.bl{padding-left:20px;margin:4px 0}.bl li{margin:3px 0}[hidden]{display:none!important}#gate{min-height:100vh;display:grid;place-items:center;padding:24px 0}#gf{background:var(--paper);color:var(--ink);padding:28px;border-radius:16px;max-width:380px;width:100%;box-shadow:0 22px 44px #0009}#gf h1{font:700 26px Georgia,serif;margin:0 0 8px}#gf input{width:100%;padding:12px;font:inherit;border:2px solid #b8c2ca;border-radius:8px;margin:12px 0 4px}#gf button{width:100%;background:var(--c);color:#fff;border:0;border-radius:999px;padding:12px;font:inherit;cursor:pointer}#err{color:#b3261e;min-height:1.5em;font-size:14px}.lnk{background:none;border:0;color:#fff;text-decoration:underline;font:inherit;cursor:pointer}</style></head><body><section id="gate"><form id="gf"><h1>Apostilas dos Cursos</h1><p>Digite o seu CPF para entrar. O acesso é só para alunos e professores cadastrados.</p><input id="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" aria-label="CPF"><div id="err" role="alert"></div><button id="go">Entrar</button></form></section><div id="app" hidden><header><div style="font-size:14px;opacity:.85"><span id="hi"></span> <button id="out" class="lnk">Sair</button></div><h1>Apostilas dos Cursos</h1><div id="tabs" role="tablist"></div></header>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),dec=u=>new TextDecoder().decode(u),norm=s=>{const d=s.replace(/\D/g,'');return d&&d.length<=11?d.padStart(11,'0'):d};
async function unlock(cpf){const s=crypto.subtle,km=await s.importKey('raw',new TextEncoder().encode(cpf),'PBKDF2',false,['deriveBits']);const bits=new Uint8Array(await s.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(G.s),iterations:G.n},km,384));const e=G.u[btoa(String.fromCharCode(...bits.slice(0,16)))];if(!e)return null;const k=await s.importKey('raw',bits.slice(16),'AES-GCM',false,['decrypt']);return JSON.parse(dec(await s.decrypt({name:'AES-GCM',iv:b64(e.i)},k,b64(e.c))))}
